# cargo-deny: vulnerabilities (RustSec), licenses, bans and sources.
# Run with `cargo deny check`.

[graph]
# Desktop targets we ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Vulnerabilities and unsound crates fail the check; unmaintained crates
# deep in the Tauri/Typst trees are reported only for our direct deps.
unmaintained = "workspace"
ignore = [
  # quick-xml 0.38 DoS on hostile XML, pulled in by typst -> hayagriva ->
  # citationberg (bibliography/CSL parsing). We never parse bibliographies or
  # user XML through Typst; citationberg pins ^0.38. Revisit on Typst updates.
  { id = "RUSTSEC-2026-0194", reason = "only reachable via Typst bibliography parsing, unused" },
  { id = "RUSTSEC-2026-0195", reason = "only reachable via Typst bibliography parsing, unused" },
  # rsa: Marvin timing side channel in RSA decryption/signing, observable by a
  # network attacker. We only generate and serialize SSH keys locally
  # (ssh-key); no RSA decryption or signing is ever performed. Revisit when
  # rsa ships a constant-time release.
  { id = "RUSTSEC-2023-0071", reason = "RSA only generated/serialized locally, never used to decrypt or sign" },
]

[licenses]
# Permissive licenses compatible with distributing under MIT.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
# Tauri pulls several versions of common crates; not actionable for us.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
