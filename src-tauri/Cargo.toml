[package]
name = "freelance-crm"
publish = false
version = "0.1.0"
description = "Desktop CRM for freelancers"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "freelance_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embedded WebDriver server for end-to-end tests (`pnpm e2e`).
# Never enable in release builds: it exposes app automation over HTTP.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]
tauri-plugin-wdio = ["dep:tauri-plugin-wdio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crm-core = { path = "../crates/crm-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.26"
specta-typescript = "0.0.13"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
tauri-plugin-wdio = { version = "1.5", optional = true }
jiff = "0.2.38"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
crm-pdf = { version = "0.1.0", path = "../crates/crm-pdf" }
base64 = "0.22"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1.9.1"
tauri-plugin-autostart = "2"

[dev-dependencies]
pdf-extract = "0.12.1"
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
toml = "1.1.8"
