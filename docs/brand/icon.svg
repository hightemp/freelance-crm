<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- freelance-crm app icon: a client card on a gradient tile, with a
       clock badge for time and deadlines. Source of src-tauri/icons
       (`make icons`). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Tile, inset as in the macOS icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- Client card. -->
  <g filter="url(#shadow)">
    <rect x="212" y="300" width="560" height="430" rx="64" fill="url(#card)"/>
  </g>
  <circle cx="352" cy="460" r="72" fill="#4F46E5"/>
  <path d="M248 640c18-62 64-96 104-96s86 34 104 96z" fill="#4F46E5"/>
  <rect x="492" y="412" width="216" height="40" rx="20" fill="#94A3B8"/>
  <rect x="492" y="488" width="168" height="40" rx="20" fill="#CBD5E1"/>
  <rect x="492" y="564" width="196" height="40" rx="20" fill="#CBD5E1"/>
  <!-- Clock badge. -->
  <g filter="url(#shadow)">
    <circle cx="742" cy="296" r="128" fill="#F59E0B"/>
  </g>
  <circle cx="742" cy="296" r="92" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M742 240v62l40 30" fill="none" stroke="#FFFFFF" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
