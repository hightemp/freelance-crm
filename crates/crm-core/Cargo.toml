[package]
name = "crm-core"
publish = false
version = "0.1.0"
description = "Business logic of freelance-crm, independent of Tauri"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
age = "0.11.5"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4"
hkdf = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.38"
mime_guess = "2.0.5"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "encryption", "std", "getrandom"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
rstest = "0.28.0"
