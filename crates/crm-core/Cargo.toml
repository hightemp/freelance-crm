[package]
name = "crm-core"
version = "0.1.0"
description = "Business logic of freelance-crm, independent of Tauri"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1.12.0"
rstest = "0.28.0"
tempfile = "3.27.0"
