[[fields]]
key = "zip"
group = "address"
max_length = 10
validator = "us_zip"
labels = { en = "ZIP code", ru = "Почтовый индекс (ZIP)" }

[[fields]]
key = "bank_name"
group = "bank"
labels = { en = "Bank name", ru = "Наименование банка" }

[[fields]]
key = "routing_number"
group = "bank"
input = "digits"
max_length = 9
validator = "us_aba"
labels = { en = "Routing number (ABA)", ru = "Маршрутный номер (ABA)" }

[[fields]]
key = "account_number"
group = "bank"
input = "digits"
max_length = 17
labels = { en = "Account number", ru = "Номер счёта" }

[[legal_forms]]
key = "sole_proprietor"
labels = { en = "Sole proprietor", ru = "Индивидуальный предприниматель (sole proprietor)" }
fields = [
  { key = "ssn_itin" },
  { key = "ein" },
  { key = "street", required = true },
  { key = "city", required = true },
  { key = "state", required = true },
  { key = "zip", required = true },
  { key = "bank_name" },
  { key = "routing_number" },
  { key = "account_number" },
]

[[legal_forms]]
key = "llc"
labels = { en = "Limited liability company (LLC)", ru = "Компания с ограниченной ответственностью (LLC)" }
fields = [
  { key = "ein", required = true },
  { key = "street", required = true },
  { key = "city", required = true },
  { key = "state", required = true },
  { key = "zip", required = true },
  { key = "bank_name" },
  { key = "routing_number" },
  { key = "account_number" },
]

[[legal_forms]]
key = "corporation"
labels = { en = "Corporation", ru = "Корпорация" }
fields = [
  { key = "ein", required = true },
  { key = "street", required = true },
  { key = "city", required = true },
  { key = "state", required = true },
  { key = "zip", required = true },
  { key = "bank_name" },
  { key = "routing_number" },
  { key = "account_number" },
]
