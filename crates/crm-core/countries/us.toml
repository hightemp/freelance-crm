# United States: sole proprietors, LLCs and corporations.
code = "US"
invoice_template = "us_invoice"
labels = { en = "United States", ru = "США" }

[[groups]]
key = "main"
labels = { en = "Tax", ru = "Налоги" }

[[groups]]
key = "address"
labels = { en = "Address", ru = "Адрес" }

[[groups]]
key = "bank"
labels = { en = "Bank", ru = "Банк" }

[[fields]]
key = "ein"
group = "main"
max_length = 10
validator = "us_ein"
labels = { en = "Employer ID (EIN)", ru = "EIN (идентификатор работодателя)" }

[[fields]]
key = "ssn_itin"
group = "main"
max_length = 11
validator = "us_ssn_itin"
labels = { en = "SSN or ITIN", ru = "SSN или ITIN" }

[[fields]]
key = "street"
group = "address"
labels = { en = "Street address", ru = "Улица и дом" }

[[fields]]
key = "city"
group = "address"
labels = { en = "City", ru = "Город" }

[[fields]]
key = "state"
group = "address"
kind = "select"
labels = { en = "State", ru = "Штат" }
