# Git hooks (installed by `pnpm install` via the prepare script).
pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    prettier:
      glob: "*.{ts,js,svelte,json,css,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}
    eslint:
      glob: "*.{ts,js,svelte}"
      run: pnpm exec eslint {staged_files}

pre-push:
  commands:
    verify:
      run: pnpm verify --quick
