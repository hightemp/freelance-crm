name: Release

# Installers for every platform (T-12.5): Linux AppImage, deb and rpm,
# Windows MSI and NSIS, macOS dmg (Apple Silicon and Intel). A `v*` tag
# makes a draft GitHub release with them; a manual run only builds.
#
# Signing is used when its secrets exist, else the builds are unsigned:
# - macOS: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, and for notarization APPLE_ID, APPLE_PASSWORD
#   (app-specific), APPLE_TEAM_ID.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
            binary: target/release/freelance-crm
          - os: windows-latest
            args: ""
            binary: target/release/freelance-crm.exe
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n

      # Empty signing variables make the bundler try to sign and fail: pass
      # them on only when the secrets exist.
      - name: Signing secrets (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: freelance-crm ${{ github.ref_name }}
          releaseBody: See the assets below for your platform.
          releaseDraft: true
          args: ${{ matrix.args }}

      # The built app starts, creates its database and keeps running.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs ${{ matrix.binary }}
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke.mjs ${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ strategy.job-index }}
          path: target/**/release/bundle/**
          if-no-files-found: error
