[workspace]
resolver = "3"
members = ["crates/crm-core", "crates/crm-pdf", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["hightemp"]

# https://tauri.app/concept/size/#cargo-configuration
# Optimized dependencies keep crypto (Argon2, RSA key generation) fast in
# debug builds and tests; our own crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
